<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ViewLigneEchangeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputText value="#{bundle.ViewLigneEchangeLabel_quantite}"/>
                    <h:outputText value="#{ligneEchangeController.selected.quantite}" title="#{bundle.ViewLigneEchangeTitle_quantite}"/>
                    <h:outputText value="#{bundle.ViewLigneEchangeLabel_echange}"/>
                    <h:outputText value="#{ligneEchangeController.selected.echange}" title="#{bundle.ViewLigneEchangeTitle_echange}"/>
                    <h:outputText value="#{bundle.ViewLigneEchangeLabel_produit}"/>
                    <h:outputText value="#{ligneEchangeController.selected.produit}" title="#{bundle.ViewLigneEchangeTitle_produit}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{ligneEchangeController.destroyAndView}" value="#{bundle.ViewLigneEchangeDestroyLink}"/>
                <br />
                <br />
                <h:link outcome="Edit" value="#{bundle.ViewLigneEchangeEditLink}"/>
                <br />
                <h:commandLink action="#{ligneEchangeController.prepareCreate}" value="#{bundle.ViewLigneEchangeCreateLink}" />
                <br />
                <h:commandLink action="#{ligneEchangeController.prepareList}" value="#{bundle.ViewLigneEchangeShowAllLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ViewLigneEchangeIndexLink}"/>

            </h:form>
        </ui:define>
    </ui:composition>

</html>
