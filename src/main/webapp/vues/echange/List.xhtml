<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListEchangeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:form styleClass="jsfcrud_list_form">
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
                </h:panelGroup>
                <h:outputText escape="false" value="#{bundle.ListEchangeEmpty}" rendered="#{echangeController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{echangeController.items.rowCount > 0}">
                    <h:outputText value="#{echangeController.pagination.pageFirstItem + 1}..#{echangeController.pagination.pageLastItem + 1}/#{echangeController.pagination.itemsCount}"/>&nbsp;
                    <h:commandLink action="#{echangeController.previous}" value="#{bundle.Previous} #{echangeController.pagination.pageSize}" rendered="#{echangeController.pagination.hasPreviousPage}"/>&nbsp;
                    <h:commandLink action="#{echangeController.next}" value="#{bundle.Next} #{echangeController.pagination.pageSize}" rendered="#{echangeController.pagination.hasNextPage}"/>&nbsp;
                    <h:dataTable value="#{echangeController.items}" var="item" border="0" cellpadding="2" cellspacing="0" rowClasses="jsfcrud_odd_row,jsfcrud_even_row" rules="all" style="border:solid 1px">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_idEchange}"/>
                            </f:facet>
                            <h:outputText value="#{item.idEchange}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_idPh}"/>
                            </f:facet>
                            <h:outputText value="#{item.idPh}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_nomPh}"/>
                            </f:facet>
                            <h:outputText value="#{item.nomPh}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_typeEchange}"/>
                            </f:facet>
                            <h:outputText value="#{item.typeEchange}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_dateEchange}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateEchange}">
                                <f:convertDateTime pattern="MM/dd/yyyy HH:mm:ss" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListEchangeTitle_idGerant}"/>
                            </f:facet>
                            <h:outputText value="#{item.idGerant}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="&nbsp;"/>
                            </f:facet>
                            <h:commandLink action="#{echangeController.prepareView}" value="#{bundle.ListEchangeViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{echangeController.prepareEdit}" value="#{bundle.ListEchangeEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink action="#{echangeController.destroy}" value="#{bundle.ListEchangeDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
                <br />
                <h:commandLink action="#{echangeController.prepareCreate}" value="#{bundle.ListEchangeCreateLink}"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.ListEchangeIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
