<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditBonDeCommandeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditBonDeCommandeLabel_idBon}" for="idBon" />
                    <h:inputText id="idBon" value="#{bonDeCommandeController.selected.idBon}" title="#{bundle.EditBonDeCommandeTitle_idBon}" required="true" requiredMessage="#{bundle.EditBonDeCommandeRequiredMessage_idBon}"/>
                    <h:outputLabel value="#{bundle.EditBonDeCommandeLabel_dateBon}" for="dateBon" />
                    <h:inputText id="dateBon" value="#{bonDeCommandeController.selected.dateBon}" title="#{bundle.EditBonDeCommandeTitle_dateBon}" required="true" requiredMessage="#{bundle.EditBonDeCommandeRequiredMessage_dateBon}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditBonDeCommandeLabel_idGerantCreateur}" for="idGerantCreateur" />
                    <h:selectOneMenu id="idGerantCreateur" value="#{bonDeCommandeController.selected.idGerantCreateur}" title="#{bundle.EditBonDeCommandeTitle_idGerantCreateur}" required="true" requiredMessage="#{bundle.EditBonDeCommandeRequiredMessage_idGerantCreateur}">
                        <f:selectItems value="#{utilisateurController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{bonDeCommandeController.update}" value="#{bundle.EditBonDeCommandeSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditBonDeCommandeViewLink}"/>
                <br />
                <h:commandLink action="#{bonDeCommandeController.prepareList}" value="#{bundle.EditBonDeCommandeShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditBonDeCommandeIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
