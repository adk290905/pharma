<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditUtilisateurTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditUtilisateurLabel_idUtilisateur}" for="idUtilisateur" />
                    <h:inputText id="idUtilisateur" value="#{utilisateurController.selected.idUtilisateur}" title="#{bundle.EditUtilisateurTitle_idUtilisateur}" required="true" requiredMessage="#{bundle.EditUtilisateurRequiredMessage_idUtilisateur}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateurLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{utilisateurController.selected.nom}" title="#{bundle.EditUtilisateurTitle_nom}" required="true" requiredMessage="#{bundle.EditUtilisateurRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateurLabel_prenom}" for="prenom" />
                    <h:inputText id="prenom" value="#{utilisateurController.selected.prenom}" title="#{bundle.EditUtilisateurTitle_prenom}" required="true" requiredMessage="#{bundle.EditUtilisateurRequiredMessage_prenom}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateurLabel_motDePasse}" for="motDePasse" />
                    <h:inputText id="motDePasse" value="#{utilisateurController.selected.motDePasse}" title="#{bundle.EditUtilisateurTitle_motDePasse}" required="true" requiredMessage="#{bundle.EditUtilisateurRequiredMessage_motDePasse}"/>
                    <h:outputLabel value="#{bundle.EditUtilisateurLabel_typeUtilisateur}" for="typeUtilisateur" />
                    <h:inputText id="typeUtilisateur" value="#{utilisateurController.selected.typeUtilisateur}" title="#{bundle.EditUtilisateurTitle_typeUtilisateur}" required="true" requiredMessage="#{bundle.EditUtilisateurRequiredMessage_typeUtilisateur}"/>
                </h:panelGrid>
                <h:commandLink action="#{utilisateurController.update}" value="#{bundle.EditUtilisateurSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditUtilisateurViewLink}"/>
                <br />
                <h:commandLink action="#{utilisateurController.prepareList}" value="#{bundle.EditUtilisateurShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditUtilisateurIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
