<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateUtilisateurTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_idUtilisateur}" for="idUtilisateur" />
                    <h:inputText id="idUtilisateur" value="#{utilisateurController.selected.idUtilisateur}" title="#{bundle.CreateUtilisateurTitle_idUtilisateur}" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_idUtilisateur}"/>
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_nom}" for="nom" />
                    <h:inputText id="nom" value="#{utilisateurController.selected.nom}" title="#{bundle.CreateUtilisateurTitle_nom}" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_nom}"/>
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_prenom}" for="prenom" />
                    <h:inputText id="prenom" value="#{utilisateurController.selected.prenom}" title="#{bundle.CreateUtilisateurTitle_prenom}" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_prenom}"/>
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_motDePasse}" for="motDePasse" />
                    <h:inputText id="motDePasse" value="#{utilisateurController.selected.motDePasse}" title="#{bundle.CreateUtilisateurTitle_motDePasse}" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_motDePasse}"/>
                    <h:outputLabel value="#{bundle.CreateUtilisateurLabel_typeUtilisateur}" for="typeUtilisateur" />
                    <h:inputText id="typeUtilisateur" value="#{utilisateurController.selected.typeUtilisateur}" title="#{bundle.CreateUtilisateurTitle_typeUtilisateur}" required="true" requiredMessage="#{bundle.CreateUtilisateurRequiredMessage_typeUtilisateur}"/>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{utilisateurController.create}" value="#{bundle.CreateUtilisateurSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{utilisateurController.prepareList}" value="#{bundle.CreateUtilisateurShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateUtilisateurIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
