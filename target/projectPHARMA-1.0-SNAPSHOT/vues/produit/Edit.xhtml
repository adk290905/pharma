<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.EditProduitTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.EditProduitLabel_NLot}" for="NLot" />
                    <h:inputText id="NLot" value="#{produitController.selected.NLot}" title="#{bundle.EditProduitTitle_NLot}" required="true" requiredMessage="#{bundle.EditProduitRequiredMessage_NLot}"/>
                    <h:outputLabel value="#{bundle.EditProduitLabel_nomC}" for="nomC" />
                    <h:inputText id="nomC" value="#{produitController.selected.nomC}" title="#{bundle.EditProduitTitle_nomC}" required="true" requiredMessage="#{bundle.EditProduitRequiredMessage_nomC}"/>
                    <h:outputLabel value="#{bundle.EditProduitLabel_qte}" for="qte" />
                    <h:inputText id="qte" value="#{produitController.selected.qte}" title="#{bundle.EditProduitTitle_qte}" required="true" requiredMessage="#{bundle.EditProduitRequiredMessage_qte}"/>
                    <h:outputLabel value="#{bundle.EditProduitLabel_ppa}" for="ppa" />
                    <h:inputText id="ppa" value="#{produitController.selected.ppa}" title="#{bundle.EditProduitTitle_ppa}" required="true" requiredMessage="#{bundle.EditProduitRequiredMessage_ppa}"/>
                    <h:outputLabel value="#{bundle.EditProduitLabel_dateExp}" for="dateExp" />
                    <h:inputText id="dateExp" value="#{produitController.selected.dateExp}" title="#{bundle.EditProduitTitle_dateExp}" required="true" requiredMessage="#{bundle.EditProduitRequiredMessage_dateExp}">
                        <f:convertDateTime pattern="MM/dd/yyyy" />
                    </h:inputText>
                    <h:outputLabel value="#{bundle.EditProduitLabel_dosage}" for="dosage" />
                    <h:inputText id="dosage" value="#{produitController.selected.dosage}" title="#{bundle.EditProduitTitle_dosage}" />
                    <h:outputLabel value="#{bundle.EditProduitLabel_conditionnement}" for="conditionnement" />
                    <h:inputText id="conditionnement" value="#{produitController.selected.conditionnement}" title="#{bundle.EditProduitTitle_conditionnement}" />
                    <h:outputLabel value="#{bundle.EditProduitLabel_idUtilisateurEnreg}" for="idUtilisateurEnreg" />
                    <h:selectOneMenu id="idUtilisateurEnreg" value="#{produitController.selected.idUtilisateurEnreg}" title="#{bundle.EditProduitTitle_idUtilisateurEnreg}" >
                        <f:selectItems value="#{utilisateurController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <h:commandLink action="#{produitController.update}" value="#{bundle.EditProduitSaveLink}"/>
                <br />
                <br />
                <h:link outcome="View" value="#{bundle.EditProduitViewLink}"/>
                <br />
                <h:commandLink action="#{produitController.prepareList}" value="#{bundle.EditProduitShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.EditProduitIndexLink}" />
            </h:form>
        </ui:define>
    </ui:composition>

</html>
