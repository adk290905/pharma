<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateLigneEchangeTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorStyle="color: red" infoStyle="color: green" layout="table"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2">
                    <h:outputLabel value="#{bundle.CreateLigneEchangeLabel_quantite}" for="quantite" />
                    <h:inputText id="quantite" value="#{ligneEchangeController.selected.quantite}" title="#{bundle.CreateLigneEchangeTitle_quantite}" required="true" requiredMessage="#{bundle.CreateLigneEchangeRequiredMessage_quantite}"/>
                    <h:outputLabel value="#{bundle.CreateLigneEchangeLabel_echange}" for="echange" />
                    <h:selectOneMenu id="echange" value="#{ligneEchangeController.selected.echange}" title="#{bundle.CreateLigneEchangeTitle_echange}" required="true" requiredMessage="#{bundle.CreateLigneEchangeRequiredMessage_echange}">
                        <f:selectItems value="#{echangeController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                    <h:outputLabel value="#{bundle.CreateLigneEchangeLabel_produit}" for="produit" />
                    <h:selectOneMenu id="produit" value="#{ligneEchangeController.selected.produit}" title="#{bundle.CreateLigneEchangeTitle_produit}" required="true" requiredMessage="#{bundle.CreateLigneEchangeRequiredMessage_produit}">
                        <f:selectItems value="#{produitController.itemsAvailableSelectOne}"/>
                    </h:selectOneMenu>
                </h:panelGrid>
                <br />
                <h:commandLink action="#{ligneEchangeController.create}" value="#{bundle.CreateLigneEchangeSaveLink}" />
                <br />
                <br />
                <h:commandLink action="#{ligneEchangeController.prepareList}" value="#{bundle.CreateLigneEchangeShowAllLink}" immediate="true"/>
                <br />
                <br />
                <h:link outcome="/index" value="#{bundle.CreateLigneEchangeIndexLink}"/>
            </h:form>
        </ui:define>
    </ui:composition>

</html>
