databases:
  - name: pharmacie-db
    databaseName: pharmacie_db
    user: pharmacie
    plan: free

services:
  - type: web
    name: pharmacie
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /resources/jakartaee11
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmacie-db
          property: connectionString
